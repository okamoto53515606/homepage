# why:
#   ZAP api-scan / full-scan に渡す Rule Configuration ファイル。
#   各 plugin id ごとに WARN / IGNORE / FAIL のしきい値を制御する。
#   形式: <pluginId>\t<IGNORE|WARN|FAIL>\t(<plugin name>)
#
#   IGNORE 指定の根拠:
#
#   40018  SQL Injection
#     本プロジェクトは DynamoDB (NoSQL) のみで SQL DB を一切使わない。
#     ZAP の Boolean-based SQLi 検出は AND 1=1 / AND 1=2 のレスポンス差で
#     誤検出するが (Cognito リダイレクト URL 長差・認証エラーレスポンス差・
#     クエリ値の HTML 反映等)、SQL クエリを組み立てていない以上アーキテクチャ
#     的に成立しない。全件 False Positive のため IGNORE。
#     再評価が必要になるのは「SQL DB を導入したとき」のみ。その際は本ファイル
#     から行を削除して再スキャンする。
#
#   10055  CSP 系警告 / 90003  SRI Missing
#     ZAP が Spider 中に accounts.google.com (Google ログイン画面) まで遷移して
#     しまい、Google 側のレスポンスに対して警告を出している。当方サイト由来では
#     ないため IGNORE。Google ドメインを scope 外にできれば理想だが、ZAP は
#     OAuth リダイレクトを follow するため除外しきれず、ルール側で抑制する。
#
# Note:
#   IGNORE は「警告を出さない」だけで「スキャンしない」ではない。本当に脆弱な
#   実装が混入したときも気づけないため、根拠なく IGNORE を増やさないこと。
40018	IGNORE	(SQL Injection — DynamoDB only, no SQL queries built)
10055	IGNORE	(CSP issues reported on accounts.google.com, not our site)
90003	IGNORE	(Sub Resource Integrity Missing on accounts.google.com)

#   2026/05/04 追加分:
#
#   40025  Proxy Disclosure
#     CloudFront の TRACE/OPTIONS 応答経由で「前段に CloudFront がいる」と
#     ZAP が推定する警告。CDN の存在自体は via ヘッダや x-amz-cf-id で公開
#     されており隠蔽できない。CDN 利用は構成上の事実なので情報価値なし。
#
#   40038  Bypassing 403
#     `x-original-url: /xxx` 等の特殊ヘッダで認可バイパスを試みるヒューリ
#     スティック。本プロジェクトの Next.js / Lambda Function URL / OAC は
#     これらのヘッダを尊重しないため、誤検知 (ZAP 側がレスポンス差分を見て
#     成立したと判断するケース) のみ。実際の認可ロジックは Cognito JWT 検証
#     と auth() ガードで実装されており、URL 書き換えだけでは突破できない。
#
#   90004  Cross-Origin-Embedder/Opener/Resource-Policy Header Missing or Invalid
#     COOP=same-origin-allow-popups, CORP=same-site, COEP=未設定 を意図的に
#     選択している (CDK の SecurityHeadersPolicy)。ZAP は厳格値 (same-origin /
#     require-corp) 以外を "Invalid" 扱いするが、Stripe Checkout 等のポップ
#     アップ連携と Next.js の prefetch を両立させるためにこの値で運用する。
#     COEP=require-corp は Stripe Elements / Google reCAPTCHA / GTM 等の 3rd
#     party iframe を全部ブロックするため有効化不可。
#
#   100001  Unexpected Content-Type was returned (大量ノイズ)
#     ほとんどが Spider/Active Scan で外部ドメイン (accounts.google.com,
#     fonts.gstatic.com, lh3.googleusercontent.com 等) を辿った先のレスポ
#     ンスに対する警告。当方サイト由来は DELETE /api/auth/session 等の
#     text/html 応答だが、これは Next.js のエラーハンドラ既定動作で、
#     Content-Type を JSON 強制すると今度は Next.js 内部の挙動と乖離する。
#     致命度低 + 大半が外部のため triage 対象から除外。
#
#   10024  Information Disclosure - Sensitive Information in URL
#     URL クエリに "session_id" という単語が含まれているだけで反応する単純
#     パターンマッチ。Stripe Checkout Session ID (`cs_test_xxx`) は publishable
#     な識別子で機密ではなく、Stripe 公式の決済完了リダイレクト URL 仕様も
#     `?session_id={CHECKOUT_SESSION_ID}` と同等。誤検知。
#
#   10110  Dangerous JS Functions
#     accounts.google.com 上の eval() 利用に対する警告。Google 側のコードで
#     当方制御外。10055/90003 と同じ理由で IGNORE。
40025	IGNORE	(Proxy Disclosure — CloudFront presence is public via x-amz-cf-id)
40038	IGNORE	(Bypassing 403 — x-original-url is not honored by Next.js/Lambda)
90004	IGNORE	(Cross-Origin-* values intentional: Stripe popup / Next.js prefetch)
100001	IGNORE	(Unexpected Content-Type — mostly 3rd party domains, low signal)
10024	IGNORE	(Stripe session_id is non-sensitive publishable identifier)
10110	IGNORE	(eval() detected in accounts.google.com out-of-scope code)

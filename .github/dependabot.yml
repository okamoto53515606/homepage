version: 2
updates:
  # why: SHA ピン留め済みの GitHub Actions を週次で自動更新。
  #      Dependabot が各アクションの新バージョンを検出し、security.yml の
  #      SHA を最新コミットに書き換えた PR を自動で開いてくれる。
  #      マージするだけで mutable tag リスクなしに最新を追従できる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # why: リリース直後のバグ修正版が出る前に PR が作られるのを防ぐ。
    #      GitHub Actions は patch でも動作変更があることがあるため 3 日待つ。
    cooldown:
      default: 3

  # why: npm の本番依存脆弱性を週次で検出。
  #      aws-cdk-lib 等の bundledDependencies に起因する修正不可アラートは
  #      "Risk is tolerable" で dismiss する運用とする。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # why: patch は数日で追加修正が出ることが多いため 3 日、
    #      minor / major は変更量が多いので 5 日冷ます。
    cooldown:
      default: 5
      semver-patch: 3
    groups:
      # why: genkit エコシステムは peer dependency が同一バージョンを要求する。
      #      個別 PR だと npm ci が ERESOLVE で失敗するため、全パッケージを
      #      1 つの PR にまとめてアトミックに更新する。
      genkit:
        patterns:
          - "genkit"
          - "@genkit-ai/*"

version: 2
updates:
  # why: SHA ピン留め済みの GitHub Actions を週次で自動更新。
  #      Dependabot が各アクションの新バージョンを検出し、security.yml の
  #      SHA を最新コミットに書き換えた PR を自動で開いてくれる。
  #      マージするだけで mutable tag リスクなしに最新を追従できる。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # why: リリース直後の不安定なバージョンへの PR を防ぐ（cooldown 有効化）。
    cooldown: {}
    # why: major バージョンアップは breaking changes のリスクがあるため自動 PR 不要。
    #      SHA ピン留めの patch/minor のみ自動追従し、major は手動で判断する。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # why: npm の本番依存脆弱性を週次で検出。
  #      aws-cdk-lib 等の bundledDependencies に起因する修正不可アラートは
  #      "Risk is tolerable" で dismiss する運用とする。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # why: リリース直後の不安定なバージョンへの PR を防ぐ（cooldown 有効化）。
    cooldown: {}
    # why: major バージョンアップは breaking changes のリスクがあるため自動 PR 不要。
    #      patch / minor のみ自動追従し、major は手動で判断する。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # why: genkit エコシステムは peer dependency が同一バージョンを要求する。
      #      個別 PR だと npm ci が ERESOLVE で失敗するため、全パッケージを
      #      1 つの PR にまとめてアトミックに更新する。
      genkit:
        patterns:
          - "genkit"
          - "@genkit-ai/*"
